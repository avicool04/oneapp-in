<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card Processing Portal</title>
  
  <!-- PDF.js Library for Client-Side Decryption & Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .section {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select, input[type="file"], input[type="text"], button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .preview-box {
      margin-top: 16px;
      text-align: center;
    }

    canvas, img {
      max-width: 100%;
      height: auto;
      border: 1px dashed var(--border);
      border-radius: 6px;
      margin-top: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background-color: #e0e7ff;
      color: #3730a3;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Identity Document Processing & Sharing</h2>

  <!-- 1. Profile Context Selector -->
  <div class="section">
    <label for="profileSelect">Active Account Context:</label>
    <select id="profileSelect" onchange="handleProfileSwitch(this.value)">
      <option value="ADULT_PRIMARY">Primary Adult Account</option>
      <option value="MINOR_DEPENDENT_1">Minor Dependent 1 (Child Profile)</option>
      <option value="MINOR_DEPENDENT_2">Minor Dependent 2 (Child Profile)</option>
    </select>
    <p>Active Role: <span id="accountRoleBadge" class="status-badge">Adult Profile</span></p>
  </div>

  <!-- 2. File Upload Interface -->
  <div class="section">
    <label for="fileInput">Upload Identity Document (PDF or JPG/PNG Image):</label>
    <input type="file" id="fileInput" accept="application/pdf, image/jpeg, image/png" onchange="processUploadedFile()">
  </div>

  <!-- 3. Document Cropping & Processing Controls -->
  <div class="section">
    <button onclick="cropAndExtractCard()">Cut Document into ID Card Portion (JPG)</button>
    
    <div class="preview-box">
      <h4>Extracted ID Card JPG Preview:</h4>
      <img id="cardPreview" alt="Cropped Card Output Will Appear Here">
    </div>
  </div>

  <!-- 4. Watermarking & Export Pipeline -->
  <div class="section">
    <label for="watermarkText">Custom Watermark Overlay (Optional):</label>
    <input type="text" id="watermarkText" placeholder="e.g., For Verification Purposes Only - Bank Name">
    
    <button onclick="executeSharingPipeline()">Generate Final Share Package</button>
  </div>
</div>

<script>
  /**
   * System State Management
   */
  const AppState = {
    currentUser: { id: "USER_ADULT_101", name: "Primary Account Holder" },
    activeProfile: { id: "USER_ADULT_101", isMinor: false },
    linkedMinors: [
      { id: "MINOR_DEPENDENT_1", name: "Minor Child 1" },
      { id: "MINOR_DEPENDENT_2", name: "Minor Child 2" }
    ],
    loadedCanvas: null,
    croppedCardJpgDataUrl: null
  };

  /**
   * 1. Profile Switcher Logic
   */
  function handleProfileSwitch(selectedId) {
    if (selectedId === "ADULT_PRIMARY") {
      AppState.activeProfile = { id: AppState.currentUser.id, isMinor: false };
      document.getElementById("accountRoleBadge").innerText = "Adult Profile";
      document.getElementById("accountRoleBadge").style.backgroundColor = "#e0e7ff";
      document.getElementById("accountRoleBadge").style.color = "#3730a3";
    } else {
      AppState.activeProfile = { id: selectedId, isMinor: true };
      document.getElementById("accountRoleBadge").innerText = "Minor Profile (Linked Account)";
      document.getElementById("accountRoleBadge").style.backgroundColor = "#fef3c7";
      document.getElementById("accountRoleBadge").style.color = "#92400e";
    }
    console.log("Account Context Switched:", AppState.activeProfile);
  }

  /**
   * 2. Upload Handler (PDF / Image Routing)
   */
  async function processUploadedFile() {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];
    if (!file) return;

    if (file.type === "application/pdf") {
      await renderPdfToCanvas(file);
    } else if (file.type.startsWith("image/")) {
      await renderImageToCanvas(file);
    } else {
      alert("Please upload a valid PDF or Image file.");
    }
  }

  /**
   * 3. PDF Handling Engine
   */
  async function renderPdfToCanvas(file) {
    const arrayBuffer = await file.arrayBuffer();

    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    loadingTask.onPassword = (updatePassword, reason) => {
      if (reason === pdfjsLib.PasswordResponses.NEED_PASSWORD) {
        const password = prompt("Enter the PDF password (e.g., First 4 letters of name in UPPERCASE + Birth Year YYYY):");
        updatePassword(password);
      }
    };

    try {
      const pdfDoc = await loadingTask.promise;
      const page = await pdfDoc.getPage(1);

      // High-DPI Canvas Rendering
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;
      AppState.loadedCanvas = canvas;
      alert("PDF loaded and rendered successfully!");
    } catch (err) {
      console.error(err);
      alert("Failed to process PDF. Check the password or file format.");
    }
  }

  /**
   * 4. Image Handling Engine
   */
  function renderImageToCanvas(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);

          AppState.loadedCanvas = canvas;
          alert("Image document loaded successfully!");
          resolve();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /**
   * 5. Cut Document into ID Card Portion (Cropping Engine)
   */
  function cropAndExtractCard() {
    if (!AppState.loadedCanvas) {
      alert("Please upload a document first.");
      return;
    }

    const srcCanvas = AppState.loadedCanvas;

    // Standard positioning coordinates for standard Aadhaar bottom section
    const cropX = 0;
    const cropY = Math.floor(srcCanvas.height * 0.58); // Target bottom card region
    const cropWidth = srcCanvas.width;
    const cropHeight = Math.floor(srcCanvas.height * 0.40);

    const cardCanvas = document.createElement("canvas");
    cardCanvas.width = cropWidth;
    cardCanvas.height = cropHeight;

    const ctx = cardCanvas.getContext("2d");
    ctx.drawImage(
      srcCanvas,
      cropX, cropY, cropWidth, cropHeight,
      0, 0, cropWidth, cropHeight
    );

    AppState.croppedCardJpgDataUrl = cardCanvas.toDataURL("image/jpeg", 0.92);
    
    // Output preview to user interface
    const previewImg = document.getElementById("cardPreview");
    previewImg.src = AppState.croppedCardJpgDataUrl;
  }

  /**
   * 6. Sharing & Export Pipeline
   */
  async function executeSharingPipeline() {
    if (!AppState.croppedCardJpgDataUrl) {
      alert("Please extract the ID card portion first.");
      return;
    }

    const watermarkText = document.getElementById("watermarkText").value;
    const finalDataUrl = await applyWatermark(AppState.croppedCardJpgDataUrl, watermarkText);

    const blob = dataURItoBlob(finalDataUrl);
    const fileName = `ID_Card_${AppState.activeProfile.id}.jpg`;

    // Web Share API integration with download fallback
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: 'image/jpeg' })] })) {
      try {
        await navigator.share({
          title: 'Identity Document Export',
          text: `Exported ID Card for Profile: ${AppState.activeProfile.id}`,
          files: [new File([blob], fileName, { type: 'image/jpeg' })]
        });
        console.log("Shared successfully!");
      } catch (err) {
        console.warn("Native sharing cancelled or failed, falling back to download.", err);
        triggerDownload(finalDataUrl, fileName);
      }
    } else {
      triggerDownload(finalDataUrl, fileName);
    }
  }

  /**
   * Helper: Apply Watermark Overlay
   */
  function applyWatermark(dataUrl, text) {
    return new Promise((resolve) => {
      if (!text) {
        resolve(dataUrl);
        return;
      }

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0);

        // Watermark styling
        ctx.font = "bold 28px sans-serif";
        ctx.fillStyle = "rgba(128, 128, 128, 0.45)";
        ctx.textAlign = "center";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        resolve(canvas.toDataURL("image/jpeg", 0.92));
      };
      img.src = dataUrl;
    });
  }

  /**
   * Helper Utilities
   */
  function dataURItoBlob(dataURI) {
    const byteString = atob(dataURI.split(',')[1]);
    const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    return new Blob([ab], { type: mimeString });
  }

  function triggerDownload(dataUrl, filename) {
    const a = document.createElement("a");
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>

</body>
</html>
