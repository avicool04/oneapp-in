<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OneApp Vault</title>

<style>

:root{
    --primary:#1e40af;
    --success:#059669;
    --danger:#ef4444;
    --bg:#f8fafc;
    --border:#e2e8f0;
    --dark:#1e293b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    background:var(--bg);
    color:var(--dark);
}

header{
    background:white;
    padding:1rem 1.5rem;
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:1.5rem;
    font-weight:800;
    color:var(--primary);
}

.container{
    max-width:1100px;
    margin:auto;
    padding:2rem 1rem;
}

.card{
    background:white;
    border-radius:16px;
    border:1px solid var(--border);
    padding:1.5rem;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:1.5rem;
}

.badge{
    background:#d1fae5;
    color:#065f46;
    padding:.4rem .8rem;
    border-radius:50px;
    font-size:.8rem;
    font-weight:700;
}

.document-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.doc-card{
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    cursor:pointer;
    text-align:center;
    transition:.25s;
    background:white;
}

.doc-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.doc-icon{
    position:relative;
    font-size:58px;
}

.passport{
    color:#0d47a1;
}

.tick{
    position:absolute;
    left:0;
    bottom:0;
    display:none;
    font-size:22px;
}

.doc-name{
    margin-top:10px;
    font-weight:700;
    font-size:1rem;
}

.doc-status{
    font-size:.9rem;
    margin-top:8px;
    color:#64748b;
}

.actions{
    display:none;
    justify-content:center;
    gap:6px;
    margin-top:14px;
}

.actions button{
    border:none;
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-size:.9rem;
}

.view{
    background:#2563eb;
}

.update{
    background:#059669;
}

.delete{
    background:#ef4444;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:white;
    padding:25px;
    border-radius:14px;
    width:90%;
    max-width:450px;
}

.modal h3{
    margin-bottom:15px;
}

.btn{
    width:100%;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    margin:6px 0;
    font-weight:600;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-outline{
    background:white;
    border:1px solid var(--border);
}

.preview-box{
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    margin-top:10px;
}

</style>
</head>
<body>

<header>
<div class="logo">OneApp Vault</div>
</header>

<div class="container">

<div class="card">

<div class="card-header">
<h2>Identity Documents</h2>
<span class="badge">Secure Vault</span>
</div>

<div class="document-grid">

<!-- Aadhaar -->
<div
class="doc-card"
onclick="openDocument('aadhaar')">

<div class="doc-icon">
🪪
<span id="tick-aadhaar" class="tick">✅</span>
</div>

<div class="doc-name">
Aadhaar
</div>

<div id="status-aadhaar"
class="doc-status">
Not Uploaded
</div>

<div id="actions-aadhaar"
class="actions">

<button
class="view"
onclick="event.stopPropagation();viewDocument('aadhaar')">
👁
</button>

<button
class="update"
onclick="event.stopPropagation();updateDocument('aadhaar')">
✏️
</button>

<button
class="delete"
onclick="event.stopPropagation();deleteDocument('aadhaar')">
🗑
</button>

</div>

</div>

<!-- PAN -->

<div
class="doc-card"
onclick="openDocument('pan')">

<div class="doc-icon">
💳
<span id="tick-pan" class="tick">✅</span>
</div>

<div class="doc-name">
PAN Card
</div>

<div id="status-pan"
class="doc-status">
Not Uploaded
</div>

<div id="actions-pan"
class="actions">
<button class="view">👁</button>
<button class="update">✏️</button>
<button class="delete">🗑</button>
</div>

</div>

<!-- Licence -->

<div
class="doc-card"
onclick="openDocument('license')">

<div class="doc-icon">
🚘
<span id="tick-license" class="tick">✅</span>
</div>

<div class="doc-name">
Driving Licence
</div>

<div id="status-license"
class="doc-status">
Not Uploaded
</div>

<div id="actions-license"
class="actions">
<button class="view">👁</button>
<button class="update">✏️</button>
<button class="delete">🗑</button>
</div>

</div>

<!-- Passport -->

<div
class="doc-card"
onclick="openDocument('passport')">

<div class="doc-icon passport">
📘
<span id="tick-passport" class="tick">✅</span>
</div>

<div class="doc-name">
Indian Passport
</div>

<div id="status-passport"
class="doc-status">
Not Uploaded
</div>

<div id="actions-passport"
class="actions">
<button class="view">👁</button>
<button class="update">✏️</button>
<button class="delete">🗑</button>
</div>

</div>

</div>

</div>

</div>

<!-- Upload Modal -->

<div id="uploadModal" class="modal">

<div class="modal-content">

<h3 id="modalTitle">
Upload Document
</h3>

<input
type="file"
id="fileInput"
style="margin-bottom:20px">

<button
class="btn btn-primary"
onclick="saveUpload()">
Save
</button>

<button
class="btn btn-outline"
onclick="closeModal()">
Cancel
</button>

</div>

</div>

<!-- View Modal -->

<div id="viewModal" class="modal">

<div class="modal-content">

<h3>
Document Preview
</h3>

<div id="previewArea"
class="preview-box">
No document
</div>

<button
class="btn btn-outline"
onclick="closeViewModal()">
Close
</button>

</div>

</div>

<script>

let currentDoc='';

const docs={
    aadhaar:false,
    pan:false,
    license:false,
    passport:false
};

function saveState(){
    localStorage.setItem(
        'oneappDocs',
        JSON.stringify(docs)
    );
}

function loadState(){

    const stored=
    localStorage.getItem(
        'oneappDocs'
    );

    if(!stored) return;

    Object.assign(
        docs,
        JSON.parse(stored)
    );

    Object.keys(docs)
    .forEach(type=>{

        if(docs[type]){
            markUploaded(type);
        }

    });
}

function openDocument(type){

    if(docs[type]){

        viewDocument(type);

    }else{

        updateDocument(type);

    }
}

function updateDocument(type){

    currentDoc=type;

    document.getElementById(
        'modalTitle'
    ).innerText=
    'Upload '+
    type.toUpperCase();

    document.getElementById(
        'uploadModal'
    ).style.display='flex';
}

function saveUpload(){

    docs[currentDoc]=true;

    markUploaded(
        currentDoc
    );

    saveState();

    closeModal();
}

function markUploaded(type){

    document.getElementById(
        'tick-'+type
    ).style.display='block';

    document.getElementById(
        'actions-'+type
    ).style.display='flex';

    document.getElementById(
        'status-'+type
    ).innerText='Uploaded';
}

function viewDocument(type){

    document.getElementById(
        'previewArea'
    ).innerHTML=
    '<strong>'+
    type.toUpperCase()+
    '</strong><br><br>Document uploaded successfully.';

    document.getElementById(
        'viewModal'
    ).style.display='flex';
}

function deleteDocument(type){

    const ok=
    confirm(
        'Delete '+type+' ?'
    );

    if(!ok) return;

    docs[type]=false;

    document.getElementById(
        'tick-'+type
    ).style.display='none';

    document.getElementById(
        'actions-'+type
    ).style.display='none';

    document.getElementById(
        'status-'+type
    ).innerText='Not Uploaded';

    saveState();
}

function closeModal(){

    document.getElementById(
        'uploadModal'
    ).style.display='none';
}

function closeViewModal(){

    document.getElementById(
        'viewModal'
    ).style.display='none';
}

loadState();

</script>

</body>
</html>
