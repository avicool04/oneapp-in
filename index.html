<!DOCTYPE html>

<head>

<style>
:root{--primary:#1e40af;--success:#22c55e;--warn:#d97706;--danger:#ef4444;--bg:#f8fafc;--dark:#1e293b;--border:#e2e8f0;--gray:#64748b;--tile:#f1f3f5}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--dark);line-height:1.6;overflow-x:hidden}
nav{background:#fff;border-bottom:1px solid var(--border);padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
.logo{font-weight:800;font-size:1.1rem;color:var(--primary)}.logo span{color:var(--gray)}
.nav-links{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.nav-links button{background:none;border:none;cursor:pointer;font-weight:600;color:var(--gray);font-size:.85rem;padding:.3rem .5rem;border-radius:6px}
.nav-links button.active{color:var(--primary);background:rgba(30,64,175,.06)}
.btn-emg{background:var(--danger)!important;color:#fff!important;padding:.35rem .7rem;border-radius:6px;font-size:.8rem}
.btn-auth{background:var(--primary)!important;color:#fff!important;padding:.35rem .7rem;border-radius:6px;font-size:.8rem}
.user-chip{display:flex;align-items:center;gap:.4rem;background:var(--primary)!important;color:#fff!important;padding:.25rem .7rem .25rem .3rem;border-radius:999px;font-weight:600;font-size:.8rem;border:none;cursor:pointer}
.avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#fff}
.avatar-fallback{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem}
.user-area{position:relative}
.dropdown{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.12);padding:.75rem;min-width:200px;display:none;z-index:300;text-align:left}
.dropdown.show{display:block}.dropdown .email{font-size:.75rem;color:var(--gray);word-break:break-all;margin-bottom:.5rem}
.container{max-width:900px;margin:1rem auto;padding:0 .75rem}
.view{display:none;animation:fadeIn .3s ease}.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border-radius:12px;border:1px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.05);padding:1rem;margin-bottom:1rem}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;border-bottom:1px solid #f1f5f9;padding-bottom:.75rem;flex-wrap:wrap;gap:.5rem}
h2{color:var(--primary);margin-bottom:.25rem;font-size:1.1rem}h3{font-size:.95rem}
.sub{color:var(--gray);font-size:.8rem;margin-bottom:.75rem}
.badge{padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700}
.badge-ok{background:#d1fae5;color:#065f46}.badge-warn{background:#fef3c7;color:#92400e}.badge-alert{background:#fee2e2;color:#991b1b}
.doc-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px dashed #f1f5f9;gap:.5rem;flex-wrap:wrap}

.btn{padding:.6rem 1rem;border-radius:8px;border:none;font-weight:600;cursor:pointer;font-size:.85rem;width:100%;margin-bottom:.4rem;transition:all .2s}
.btn:hover{opacity:.9}.btn-sm{padding:.35rem .7rem;font-size:.75rem;width:auto;margin:0}
.btn-primary{background:var(--primary);color:#fff}.btn-outline{background:#fff;border:1px solid var(--border);color:var(--dark)}
.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}

.field input,.field select{width:100%;padding:.5rem;border:1px solid var(--border);border-radius:6px;font-size:.85rem}

.divider::before,.divider::after{content:"";flex:1;border-bottom:1px solid var(--border)}.divider span{padding:0 .5rem}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.5rem}
.icon-tile{display:flex;flex-direction:column;align-items:center;gap:.3rem;cursor:pointer}
.icon-box{width:50px;height:50px;background:var(--tile);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative}
.icon-box svg{width:32px;height:32px}
.icon-tile span{font-size:.65rem;font-weight:600;color:var(--dark);text-align:center;line-height:1.1}
.status-badge{position:absolute;bottom:0;left:0;width:16px;height:16px;background:var(--success);border-radius:50%;border:2px solid #fff;display:none;align-items:center;justify-content:center;z-index:2}
.status-badge.show{display:flex}

.family-list-item{display:flex;align-items:center;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--border)}
.family-list-item:last-child{border-bottom:none}
.family-avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7rem;margin-right:.5rem}
.invite-tabs{display:flex;gap:.4rem;margin-bottom:.75rem}
.invite-tab{flex:1;padding:.4rem;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:.75rem;font-weight:600;text-align:center}
.invite-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.viewer-img{width:100%;border-radius:8px;border:1px solid var(--border);margin:.5rem 0;background:#f8fafc}
.viewer-head{display:flex;justify-content:space-between;align-items:center;position:relative;margin-bottom:.25rem}
.vdots{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;line-height:1}
.viewer-menu{position:absolute;right:0;top:115%;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.15);padding:.4rem;display:none;z-index:60;min-width:150px;text-align:left}
.viewer-menu.show{display:block}
footer{text-align:center;padding:1.5rem 1rem;color:var(--gray);font-size:.7rem}
@media(max-width:480px){.icon-grid{grid-template-columns:repeat(3,1fr)}.modal{padding:1rem;max-width:100%}nav{padding:.5rem .75rem}}
</style>

const SUPABASE_ANON_KEY='sb_publishable_Pu_bqx8BwJZoeZ_Z8JrRbw_PSnoVdZ7';

let currentUser=null,familyMembers=[],currentChildId=null,currentChildName='';

async function signInWithGoogle(){const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}});if(error)showMsg(error.message);}
function showMsg(t){const m=document.getElementById('authMsg');m.textContent=t;m.style.display='block';}

// --- PROFILE MANAGEMENT ---
function openProfileModal(){
  if(!currentUser)return;
  const m=currentUser.user_metadata||{};
  document.getElementById('profileName').value = m.full_name || m.name || '';
  document.getElementById('profileEmail').value = currentUser.email || '';
  document.getElementById('profilePhone').value = m.phone || '';
  openModal('profileModal');
}

async function saveProfile(){
  const name = document.getElementById('profileName').value.trim();
  const phone = document.getElementById('profilePhone').value.trim();
  if(!name) return alert('Name is required');
  
  const { error } = await sb.auth.updateUser({
    data: { full_name: name, phone: phone }
  });
  
  if(error) alert('❌ Error updating: '+error.message);
  else {
    alert('✅ Profile updated!');
    closeModal('profileModal');
    const newFull = name;
    document.getElementById('userName').textContent = newFull;
    const fb = document.getElementById('userAvatarFallback');
    fb.textContent = (newFull.charAt(0)||'U').toUpperCase();
  }
}

// --- ROBUST INVITE CHECK (URL param + Email/Phone) ---
async function checkForInvite(){
  if(!currentUser) return;

  const params = new URLSearchParams(window.location.search);
  const inviteFromUrl = params.get('invite');
  if(inviteFromUrl){
    const { data } = await sb.from('family_links')
      .select('*')
      .eq('id', inviteFromUrl)
      .eq('status', 'pending')
      .maybeSingle();
    if(data){
      showConsentModal(data);
      return;
    }
  }

  const userPhone = currentUser.user_metadata?.phone || '';
  const userEmail = currentUser.email || '';
  
  let query = sb.from('family_links').select('*').eq('status', 'pending');
  
  if(userEmail && userPhone) {
     query = query.or(`member_email.eq.${userEmail},member_phone.eq.${userPhone}`);
  } else if (userEmail) {
     query = query.eq('member_email', userEmail);
  } else if (userPhone) {
     query = query.eq('member_phone', userPhone);
  } else {
    return;
  }
  
  const { data: found } = await query.limit(1);
  if(found && found.length > 0) {
    showConsentModal(found[0]);
  }
}

function showConsentModal(data){
  pendingInviteId = data.id;
  const inviterName = data.inviter_name || data.display_name || 'Someone';
  document.getElementById('consentText').textContent = `${inviterName} wants to add you to their Family Group on OneApp. Do you allow this?`;
  document.getElementById('consentActions').style.display = 'flex';
  openModal('consentModal');
}

async function processConsent(allow){
  if(!pendingInviteId || !currentUser) return;

  if(allow){
    let { error } = await sb.rpc('accept_invite', { invite_id: pendingInviteId });
    if(error){
      const { error: upErr } = await sb.from('family_links')
        .update({ status: 'accepted', member_user_id: currentUser.id })
        .eq('id', pendingInviteId)
        .eq('status', 'pending');
      error = upErr;
    }
    if(error) alert('❌ Error accepting: ' + error.message);
    else {
      alert('✅ You have joined the family group!');
      loadFamilyMembers();
    }
  } else {
    let { error } = await sb.rpc('reject_invite', { invite_id: pendingInviteId });
    if(error){
      await sb.from('family_links').update({ status: 'rejected' }).eq('id', pendingInviteId);
    }
    alert('Invite rejected.');
  }
  closeModal('consentModal');
  window.history.pushState({},'',window.location.pathname);
  pendingInviteId = null;
}

function setupRealTimeFamily(){
  if(!currentUser) return;
  if(familyChannel) sb.removeChannel(familyChannel);
  familyChannel = sb.channel('family_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'family_links', filter: `owner_id=eq.${currentUser.id}` }, () => { if(document.getElementById('familyManagerModal').classList.contains('show')) loadFamilyMembers(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'family_links', filter: `member_user_id=eq.${currentUser.id}` }, () => { if(document.getElementById('familyManagerModal').classList.contains('show')) loadFamilyMembers(); })
    .subscribe();
}

function pwKey(uid,tag){return 'oneapp_pdf_pw_'+uid+'_'+tag;}
function savePdfPassword(uid,tag,pw){try{localStorage.setItem(pwKey(uid,tag),pw);}catch(e){}}
function getSavedPdfPassword(uid,tag){try{return localStorage.getItem(pwKey(uid,tag));}catch(e){return null;}}

async function loadFamilyMembers(){
  if(!currentUser)return;
  const uid = currentUser.id;
  
  const { data: outgoing } = await sb.from('family_links').select('*').eq('owner_id', uid).in('status', ['accepted', 'pending']);
  const { data: incoming } = await sb.from('family_links').select('*').eq('member_user_id', uid).in('status', ['accepted', 'pending']);

  familyMembers = [...(outgoing || []), ...(incoming || [])];
  familyMembers = familyMembers.filter((v,i,a)=>a.findIndex(t=>t.id === v.id)===i);
  renderFamilyList();
}

function renderFamilyList(){
  const cont=document.getElementById('familyListContainer');
  if(!familyMembers.length){
    cont.innerHTML='<p class="sub">No family members linked yet. Invite someone!</p>';
    return;
  }
  cont.innerHTML='';
  familyMembers.forEach(fm=>{
    const isOwner = fm.owner_id === currentUser.id;
    const isMe = fm.member_user_id === currentUser.id;

    let name;
    if(isOwner){
      name = fm.display_name || (fm.member_email ? fm.member_email.split('@')[0] : 'Member');
    } else {
      name = fm.inviter_name || 'Family Member';
    }

    const initials = name.substring(0,2).toUpperCase();
    let statusBadge = '';
    if(fm.status === 'pending') statusBadge = '<span class="badge badge-warn">Pending</span>';
    else if(fm.status === 'accepted') statusBadge = '<span class="badge badge-ok">Connected</span>';

    const deleteBtn = (isOwner && fm.status === 'pending') 
      ? `<button class="btn btn-danger btn-sm" onclick="deleteMember('${fm.id}')">🗑 Cancel</button>` 
      : '';

    const clickAction = fm.is_minor 
      ? `openChildVault('${fm.id}','${name.replace(/'/g,"\\'")}')` 
      : `alert('Shared docs view coming soon for ${name}')`;

    const div=document.createElement('div');
    div.className='family-list-item';
    div.innerHTML=`
      <div style="display:flex;align-items:center;cursor:pointer" onclick="${clickAction}">
        <div class="family-avatar-sm">${initials}</div>
        <div>
          <strong>${name}</strong> ${isMe && !isOwner ? '<span class="badge badge-ok">(You joined)</span>' : ''}
          <br><small style="color:var(--gray)">${(fm.relation_type||'').toUpperCase()}${fm.is_minor?' • Minor':''} ${statusBadge}</small>
        </div>
      </div>
      <div style="display:flex;gap:.3rem">${deleteBtn}</div>
    `;
    cont.appendChild(div);
  });
}

function openFamilyManager(){if(!currentUser){alert('Sign in first.');return;}loadFamilyMembers();openModal('familyManagerModal');}
function deleteMember(id){if(!confirm('Cancel this request?'))return;sb.from('family_links').delete().eq('id',id).then(({error})=>{if(error)alert('❌ '+error.message);else{alert('✅ Cancelled.');loadFamilyMembers();}});}
function setInviteTab(tab){['email','whatsapp','sms'].forEach(t=>{document.getElementById('inviteContent-'+t).style.display=t===tab?'block':'none';});document.querySelectorAll('.invite-tab').forEach(el=>el.classList.remove('active'));event.target.classList.add('active');}
function openInviteModal(){openModal('inviteModal');}

async function sendInviteEmail(){
  const name=document.getElementById('inviteName').value.trim();
  const email=document.getElementById('inviteEmail').value.trim();
  const rel=document.getElementById('inviteRelation').value;
  if(!name||!email)return alert('Enter Name and Email');
  
  const inviterName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'Someone';

  const{data, error}=await sb.from('family_links').insert({
    owner_id:currentUser.id,
    member_email:email,
    member_phone:null,
    relation_type:rel,
    status:'pending',
    display_name:name,
    inviter_name: inviterName
  }).select();
  
  if(error){
    alert('❌ Database Error: ' + error.message);
  } else {
    const inviteId = data[0].id;
    const link = `https://oneapp-in.vercel.app/?invite=${inviteId}`;
    alert(`✅ Invite created for ${name}!\n\nLink: ${link}\n\n(Copy and send this link)`);
    closeModal('inviteModal');
    loadFamilyMembers();
  }
}

  if(!phone)return alert('Enter Phone Number');
  
  const rel=document.getElementById('inviteRelationWa').value;
  const inviterName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'Someone';

  const {data, error} = await sb.from('family_links').insert({
    owner_id:currentUser.id,
    member_email:null,
    member_phone:phone,
    relation_type:rel,
    status:'pending',
    display_name:name,
    inviter_name: inviterName
  }).select();

  if(error){
    alert('❌ Could not create unique link.\n\nError: ' + error.message);
    return; 
  }

  const inviteId = data[0].id;
  const link = `https://oneapp-in.vercel.app/?invite=${inviteId}`;
  const msg = `Hi ${name}! ${inviterName} invited you to join their family on OneApp. Click here to accept: ${link}`;
  
  window.open(`https://wa.me/${phone.replace(/\s+/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
  closeModal('inviteModal');
  loadFamilyMembers();
}

function openAddMinorModal(){openModal('minorModal');}
async function addMinor(){
  const name=document.getElementById('minorName').value.trim(),dob=document.getElementById('minorDob').value;
  if(!name||!dob)return alert('Fill all fields');
  const inviterName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name || 'Parent';
  const{error}=await sb.from('family_links').insert({
    owner_id:currentUser.id,
    member_email:'minor_'+Date.now()+'@internal',
    relation_type:'child',
    is_minor:true,
    status:'accepted',
    display_name:name,
    inviter_name: inviterName,
    permissions:{name:name,dob:dob}
  });
  if(error)alert('❌ '+error.message);
  else{alert('✅ '+name+"'s profile created.");closeModal('minorModal');loadFamilyMembers();}
}
