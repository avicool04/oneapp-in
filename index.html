<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneApp.in loading…</title>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:2rem">Loading OneApp…</p>
<script>
(async function(){
  try {
    const urls = [
      'https://raw.githubusercontent.com/avicool04/oneapp-in/9d77abdd37/index.html',
      'https://cdn.jsdelivr.net/gh/avicool04/oneapp-in@9d77abdd37/index.html'
    ];
    let text = null;
    for (const u of urls) {
      try {
        const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now());
        if (r.ok) { text = await r.text(); if (text && text.length > 50000) break; }
      } catch (e) {}
    }
    if (!text || text.length < 50000) {
      document.body.innerHTML = '<p style="font-family:sans-serif;padding:2rem">Could not load app. Open GitHub repo and restore index.html from commit 9d77abdd37.</p>';
      return;
    }
    document.open();
    document.write(text);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p>Load error: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
