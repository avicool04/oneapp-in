plugins {
    id 'com.android.application'
}

android {
    namespace 'app.oneapp.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'app.oneapp.mobile'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.15.0'
}
